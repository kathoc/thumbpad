[package]
name = "thumbpad"
version = "0.1.15"
edition = "2024"
rust-version = "1.96"
description = "Low-overhead ThumbSense-style clicks and touchpad edge guard for Windows 11"
license = "MIT"
repository = "https://github.com/kathoc/thumbpad"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.1", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Devices_HumanInterfaceDevice", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_UI_Controls"] }
